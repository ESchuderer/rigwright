sonar.organization=eike-landin
sonar.projectKey=ESchuderer_rigwright
sonar.sourceEncoding=UTF-8

# Tests sit among the sources, so both properties point at the same folder and the globs split them: the test globs
# select the test files in sonar.test.inclusions and remove them from the main code in sonar.exclusions. If tests
# live in their own folder, set sonar.tests to that folder and drop the globs from sonar.exclusions.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/test/**,**/tests/**,**/e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,docs/**,**/*.test.*,**/*.spec.*,**/test/**,**/tests/**,**/e2e/**

# Coverage report the CI job writes before the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
